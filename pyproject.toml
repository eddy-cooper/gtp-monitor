[project]
name = "gtp-monitor"
version = "1.0.0"
description = "Groundwater treatment plant monitoring tool — water balance, validation, and flowmeter-drift alerting"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gtp = "gtp.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gtp.web" = ["templates/*", "static/*", "static/vendor/*"]
